<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout</title>

    <style>
        :root {
            --primary: #2563eb;
            --bg: #f5f7fb;
            --card: #ffffff;
            --border: #e6eaf2;
            --text: #111827;
            --muted: #667085;
            --success: #16a34a;

            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: transparent;
        }

        .widget {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 360px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(17, 24, 39, 0.06);
        }

        h2 {
            margin: 0 0 8px;
            font-size: 1.2rem;
            color: var(--text);
        }

        p {
            margin: 0 0 18px;
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.45;
        }

        .loader {
            margin: 10px auto 0;
            width: 32px;
            height: 32px;
            border: 3px solid #e6eaf2;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .success-icon {
            display: none;
            margin: 8px auto 0;
            width: 40px;
            height: 40px;
            border-radius: 999px;
            background: rgba(22, 163, 74, 0.12);
            color: var(--success);
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
        }

        .meta {
            margin-top: 14px;
            font-size: 0.82rem;
            color: var(--muted);
            word-break: break-word;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <main class="widget">
        <div class="card">
            <h2 id="titleText">Checkout Initiated</h2>
            <p id="statusText">Waiting for payment confirmation...</p>
            <div id="loader" class="loader"></div>
            <div id="successIcon" class="success-icon">✓</div>
            <div id="metaText" class="meta"></div>
        </div>
    </main>

    <script type="module">
        const titleText = document.getElementById("titleText");
        const statusText = document.getElementById("statusText");
        const loader = document.getElementById("loader");
        const successIcon = document.getElementById("successIcon");
        const metaText = document.getElementById("metaText");

        const setWaitingState = (sessionId) => {
            titleText.innerText = "Checkout Initiated";
            statusText.innerText = "Waiting for payment confirmation...";
            loader.style.display = "block";
            successIcon.style.display = "none";
            metaText.innerText = sessionId ? `Session ID: ${sessionId}` : "";
        };

        const setOpenedState = (sessionId) => {
            titleText.innerText = "Checkout Initiated";
            statusText.innerText = "Complete the payment in the opened checkout window.";
            loader.style.display = "block";
            successIcon.style.display = "none";
            metaText.innerText = sessionId ? `Session ID: ${sessionId}` : "";
        };

        const setSuccessState = (sessionId) => {
            titleText.innerText = "Payment Confirmed";
            statusText.innerText = "Your payment has been received successfully.";
            loader.style.display = "none";
            successIcon.style.display = "flex";
            metaText.innerText = sessionId ? `Session ID: ${sessionId}` : "";
        };

        const setTimeoutState = (sessionId) => {
            titleText.innerText = "Payment Timeout";
            statusText.innerText = "Your payment request has timed out.";
            loader.style.display = "none";
            successIcon.style.display = "flex";
            metaText.innerText = sessionId ? `Session ID: ${sessionId}` : "";
        };

        const waitForPayment = async (sessionId) => {
            console.log("Waiting for payment confirmation for session:", sessionId);
            const interval = setInterval(async () => {
                console.log("Checking payment status for session:", sessionId);
                const res = await fetch(`https://chatgpt-app-mcp.onrender.com/api/token?tokenId=${sessionId}`);
                console.log("Payment status response:", res);
                if (res.status === 200) {
                    clearInterval(interval);
                    setSuccessState(sessionId);
                    await window.openai.sendFollowUpMessage({
                    prompt: "Transaction completed for session: " + sessionId ,
                    scollToBottom: true,
                    })
                }
                setTimeout(() => {
                  clearInterval(interval);
                  setTimeoutState(sessionId);
                  window.openai.sendFollowUpMessage({
                    prompt: "Transaction timeout for session: " + sessionId ,
                    scollToBottom: true,
                    })
                }, 300000); // 5 minutes timeout
            }, 3000);
        };

        const handleCheckout = async (sessionId) => {
            console.log("Opening checkout with and session ID:", sessionId);
            setWaitingState(sessionId);

            try {
                console.log("setting opened state for session:", sessionId);
                setOpenedState(sessionId);
                waitForPayment(sessionId);
                // optional demo auto-success after some time
                // remove this block if you only want backend confirmation
            } catch (error) {
                titleText.innerText = "Checkout Open Failed";
                statusText.innerText = "Unable to open checkout. Please try again.";
                loader.style.display = "none";
                successIcon.style.display = "none";
                metaText.innerText = "";
                console.error(error);
            }
        };

        const updateFromResponse = (response) => {
            const sessionId = response.structuredContent?.order?.sessionId; 
            handleCheckout( sessionId);
            
        };






    let rpcId = 0;
      const pendingRequests = new Map();

      const rpcNotify = (method, params) => {
        window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      };

      const rpcRequest = (method, params) =>
        new Promise((resolve, reject) => {
          const id = ++rpcId;
          console.log("Sending RPC request:", method, params, "with id:", id);
          pendingRequests.set(id, { resolve, reject });
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        });

      window.addEventListener(
        "message",
        (event) => {
          console.log("Received message event:", event);
          if (event.source !== window.parent) return;
          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") return;

          console.log("Processing JSON-RPC message:", message);

          if (typeof message.id === "number") {
            const pending = pendingRequests.get(message.id);
            if (!pending) return;
            pendingRequests.delete(message.id);

            if (message.error) {
              console.error("RPC error:", message.error);
              pending.reject(message.error);
              return;
            }

            console.log("RPC response:", message.result);
            pending.resolve(message.result);
            return;
          }

          if (typeof message.method !== "string") return;
          if (message.method === "ui/notifications/tool-result") {
            console.log("Received tool result notification order widget:", message.params);
            updateFromResponse(message.params);
          }
        },
        { passive: true }
      );

      const initializeBridge = async () => {
        console.log("Initializing MCP Apps bridge");
        const appInfo = { name: "order-widget", version: "0.2.0" };
        const appCapabilities = {checkout : true};
        const protocolVersion = "2026-01-26";

        try {
          await rpcRequest("ui/initialize", {
            appInfo,
            appCapabilities,
            protocolVersion,
          });
          console.log("Bridge initialized successfully");
          rpcNotify("ui/notifications/initialized", {});
        } catch (error) {
          console.error("Failed to initialize the MCP Apps bridge:", error);
        }
      };

      initializeBridge();

    </script>
</body>

</html>
